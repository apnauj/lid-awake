<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="lid-awake: keep Claude Code running with the lid closed">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1b2f"/>
      <stop offset="1" stop-color="#2d1b4e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff6f91"/>
    </linearGradient>
  </defs>
  <rect width="900" height="260" rx="20" fill="url(#bg)"/>
  <!-- stars -->
  <g fill="#ffffff" opacity="0.55">
    <circle cx="70" cy="40" r="1.6"/><circle cx="160" cy="95" r="1.2"/><circle cx="330" cy="30" r="1.5"/>
    <circle cx="520" cy="50" r="1.2"/><circle cx="760" cy="36" r="1.8"/><circle cx="840" cy="120" r="1.3"/>
    <circle cx="610" cy="215" r="1.4"/><circle cx="90" cy="205" r="1.5"/>
  </g>
  <!-- laptop with lid closed + sun glow -->
  <g transform="translate(95 105)">
    <circle cx="75" cy="30" r="62" fill="url(#glow)" opacity="0.16"/>
    <rect x="0" y="48" width="150" height="14" rx="5" fill="#3a3a5c"/>
    <rect x="8" y="34" width="134" height="16" rx="4" fill="#4b4b78"/>
    <rect x="52" y="52" width="46" height="4" rx="2" fill="#2b2b45"/>
    <circle cx="75" cy="42" r="3.2" fill="url(#glow)"/>
    <text x="75" y="95" fill="#9a9acb" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" text-anchor="middle">lid closed, still running</text>
  </g>
  <text x="300" y="115" fill="#ffffff" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="58" font-weight="700">lid-awake</text>
  <rect x="300" y="128" width="150" height="5" rx="2.5" fill="url(#glow)"/>
  <text x="300" y="168" fill="#d6d6f5" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="22">One click. Close the lid. Claude keeps working.</text>
  <text x="300" y="203" fill="#9a9acb" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15">a Claude Code mod  ·  macOS  ·  Linux  ·  Windows</text>
</svg>
